
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Income Refer</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Student Income App Download">

<meta property="og:url" content="https://student-income-bd.github.io/download/">
<meta property="og:image" content="https://ibb.co.com/Pv2Lhzkc">
<meta name="twitter:card" content="summary_large_image">

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#fff}
.image-wrap{position:relative;width:100%;max-width:600px}
.image-wrap img{display:block;width:100%;height:auto}
.download-btn{
position:absolute;top:35%;left:50%;
transform:translate(-50%,-50%);
width:340px;max-width:85%;
padding:9px 0;font-size:15px;font-weight:bold;
background:#00875F;color:#fff;border:0;border-radius:8px;
text-decoration:none;text-align:center;
box-shadow:0 4px 12px #0004;cursor:pointer;white-space:nowrap
}
.download-btn:active{transform:translate(-50%,-50%) scale(.96)}
</style>
</head>
<body>

<div class="image-wrap">
<img src="IMG_20261028_235622.png" alt="Student Income">
<a class="download-btn"
href="https://tetnykcmkukjukttluks.supabase.co/storage/v1/object/public/apk/student-income-v3.apk">
Download
</a>
</div>

<script>
const btn=document.querySelector('.download-btn');
const apk=btn.href;

btn.addEventListener('click',async function(e){
e.preventDefault();

if(btn.dataset.busy==='1')return;
btn.dataset.busy='1';
btn.textContent='Downloading...';

try{
const response=await fetch(apk);
if(!response.ok)throw new Error();

const blob=await response.blob();
const url=URL.createObjectURL(blob);
const a=document.createElement('a');

a.href=url;
a.download='student-income-v3.apk';
document.body.appendChild(a);
a.click();
a.remove();

btn.textContent='Complete';
setTimeout(()=>URL.revokeObjectURL(url),60000);

}catch(error){
btn.textContent='Download Fail';
}finally{
btn.dataset.busy='0';
}
});
</script>

</body>
</html>
